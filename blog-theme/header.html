<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.c{position:relative;width:966px;height:300px;overflow:hidden;background:#0B1B3A}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.b1{width:520px;height:420px;left:430px;top:-160px;background:#2F6BFF;opacity:.75}
.b2{width:380px;height:320px;left:700px;top:120px;background:#7CE0D3;opacity:.55}
.b3{width:340px;height:300px;left:-120px;top:150px;background:#1E3F8F;opacity:.9}
.b4{width:240px;height:200px;left:560px;top:170px;background:#A9B8FF;opacity:.45}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 55%,#000 100%)}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay}
.glass{position:absolute;right:70px;top:62px;width:250px;height:176px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(5,12,30,.35)}
.ring{position:absolute;right:250px;top:36px;width:86px;height:86px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45)}
.dot{position:absolute;right:243px;top:70px;width:12px;height:12px;border-radius:50%;background:#7CE0D3;box-shadow:0 0 18px #7CE0D3}
.bar{position:absolute;left:98px;width:0;height:8px;border-radius:4px;background:rgba(255,255,255,.55)}
.line{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#2F6BFF,#7CE0D3,#A9B8FF)}
</style></head><body><div class="c">
<div class="blob b3"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b4"></div>
<div class="grid"></div>
<div class="glass">
 <svg width="250" height="176" viewBox="0 0 250 176" fill="none">
  <rect x="24" y="26" width="34" height="34" rx="10" fill="rgba(124,224,211,.9)"/>
  <path d="M33 43l6 6 11-12" stroke="#0B1B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="70" y="30" width="120" height="9" rx="4.5" fill="rgba(255,255,255,.75)"/>
  <rect x="70" y="47" width="80" height="7" rx="3.5" fill="rgba(255,255,255,.35)"/>
  <polyline points="24,140 64,118 100,126 140,96 180,104 226,70" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="226" cy="70" r="5" fill="#7CE0D3"/>
  <line x1="24" y1="152" x2="226" y2="152" stroke="rgba(255,255,255,.2)"/>
 </svg>
</div>
<div class="ring"></div><div class="dot"></div>
<svg class="grain" width="966" height="300"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="line"></div>
</div></body></html>
