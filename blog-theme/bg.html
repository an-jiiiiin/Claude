<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.c{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FFF8E9}
.dots{position:absolute;inset:0;background-image:radial-gradient(#F3E3C2 2px,transparent 2.2px);background-size:26px 26px;-webkit-mask-image:linear-gradient(#000 55%,transparent 100%)}
.ico{position:absolute;filter:url(#wobble)}
.w{position:absolute;display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter>
<symbol id="cloud" viewBox="0 0 150 90"><path d="M30 70c-16 0-24-18-12-28 2-16 22-22 32-12 8-18 38-18 44 4 18-4 30 14 22 28-2 6-8 8-14 8z" fill="#fff" stroke="#4A3F35" stroke-width="3"/><circle cx="62" cy="54" r="3" fill="#4A3F35"/><circle cx="86" cy="54" r="3" fill="#4A3F35"/><path d="M68 62q6 6 12 0" stroke="#4A3F35" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="55" cy="62" r="5" fill="#FFB3C1"/><circle cx="93" cy="62" r="5" fill="#FFB3C1"/></symbol>
<symbol id="cloudp" viewBox="0 0 150 90"><path d="M30 70c-16 0-24-18-12-28 2-16 22-22 32-12 8-18 38-18 44 4 18-4 30 14 22 28-2 6-8 8-14 8z" fill="#fff" stroke="#4A3F35" stroke-width="3"/></symbol>
<symbol id="star" viewBox="0 0 36 36"><path d="M18 2q3 13 16 16q-13 3-16 16q-3-13-16-16q13-3 16-16z" stroke="#4A3F35" stroke-width="2.5" stroke-linejoin="round"/></symbol>
<symbol id="sp" viewBox="0 0 36 36"><path d="M18 2q3 13 16 16q-13 3-16 16q-3-13-16-16q13-3 16-16z"/></symbol>
<symbol id="heart" viewBox="0 0 40 36"><path d="M20 33C6 23 2 16 2 10 2 5 6 2 11 2c4 0 7 3 9 6 2-3 5-6 9-6 5 0 9 3 9 8 0 6-4 13-18 23z" fill="#FF8FA3" stroke="#4A3F35" stroke-width="2.5"/></symbol>
<symbol id="badge" viewBox="-5 -5 120 120"><path d="M55 6l12 9 15-2 5 14 14 6-2 15 9 12-9 12 2 15-14 6-5 14-15-2-12 9-12-9-15 2-5-14-14-6 2-15-9-12 9-12-2-15 14-6 5-14 15 2z" fill="#7BC8A4" stroke="#4A3F35" stroke-width="3" stroke-linejoin="round"/><path d="M36 56l13 13 25-27" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="leaf" viewBox="0 0 60 60"><path d="M30 56C10 44 6 22 30 4c24 18 20 40 0 52z" fill="#5BAE7C" stroke="#4A3F35" stroke-width="3"/><path d="M30 14v40" stroke="#4A3F35" stroke-width="2.5"/></symbol>
<symbol id="note" viewBox="0 0 90 100"><rect x="4" y="4" width="82" height="92" rx="10" fill="#fff" stroke="#4A3F35" stroke-width="3"/><rect x="30" y="0" width="30" height="12" rx="3" fill="#FFD25C" stroke="#4A3F35" stroke-width="2.5"/><path d="M20 36h50M20 54h50M20 72h32" stroke="#E6D3B0" stroke-width="5" stroke-linecap="round"/><path d="M58 70l7 7 13-15" stroke="#5BAE7C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="c"><div class="dots"></div>

</div></body></html>
