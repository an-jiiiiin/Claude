<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바른생각 미션 표지</title>
<style>
/* Layout: 1080×1350 표지 — 밝게 보정한 실사 전면 + 하단 화이트 그라데이션 위에 제목만, 72px 마진 */
@font-face{font-family:Pretendard;font-weight:500;src:url(fonts/Pretendard-Medium.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:700;src:url(fonts/Pretendard-Bold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:900;src:url(fonts/Pretendard-Black.woff2) format("woff2")}
:root{
  --brand:#E5322D; --ink:#1E1C1C; --paper:#FFFFFF; --muted:#8C8280;
  /* 제품 패키지에서 뽑은 컬러 */
  --gel-standard:#8DB3E2; --gel-soothing:#C9DD4F;
  --airfit:#5BB5B4; --extreme:#5CC66C;
  --m:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#bbb;font-family:Pretendard,sans-serif;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
.card{width:1080px;height:1350px;position:relative;overflow:hidden;background:#fff;margin-bottom:40px}
.card img{position:absolute;top:0;height:1180px;width:auto;max-width:none;
  filter:brightness(1.16) contrast(1.04) saturate(1.06)}
.card::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,0) 56%,rgba(255,255,255,.85) 74%,#fff 86%)}
.title{position:absolute;left:72px;right:72px;bottom:96px;z-index:2;
  font-size:112px;font-weight:900;letter-spacing:-.045em;line-height:1.08;color:var(--ink)}
.title em{font-style:normal;color:var(--accent)}
</style>
</head>
<body>

<section class="card" id="m2-cover" style="--accent:#5E8FCB">
  <img src="photos/IMG_6530.jpg" alt="" style="left:-212px;top:-40px">
  <h1 class="title">바른생각 젤<br><em>2종 솔직 후기</em></h1>
</section>

<section class="card" id="m3-cover" style="--accent:#2E9C8E">
  <img src="photos/IMG_6540.jpg" alt="" style="left:-318px;top:-60px">
  <h1 class="title">올리브영 콘돔<br><em>에어핏 vs 익스트림</em></h1>
</section>

</body>
</html>
